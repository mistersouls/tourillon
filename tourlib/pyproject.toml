[build-system]
requires = ["hatchling>=1"]
build-backend = "hatchling.build"

[project]
name = "tourlib"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography==46.0.3", # Keeps builds independent of a Rust/OpenSSL toolchain.
    "cyclopts>=4.22.3",
    "msgpack>=1.1",
    "tomli-w>=1.2",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
include = ["**/*.py"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "tourlib"
