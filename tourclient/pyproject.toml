[build-system]
requires = ["hatchling>=1"]
build-backend = "hatchling.build"

[project]
name = "tourclient"
version = "0.0.0"
description = "Async client library for Tourillon."
requires-python = ">=3.14"
dependencies = ["tourlib"]

[tool.uv]
package = true

[tool.uv.sources]
tourlib = { workspace = true }

[tool.hatch.build.targets.wheel]
include = ["**/*.py"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "tourclient"
