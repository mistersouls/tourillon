name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install CPython 3.14
        run: uv python install 3.14

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.14

      # Runs the whole suite, including tests/e2e, which drives the real
      # `tourillon` / `tourctl` executables installed into the uv venv.
      # `--journey-artifacts` is only accepted when tests/e2e is targeted
      # explicitly, so E2E reports are produced by the dedicated step below.
      - name: Run test suite with coverage gate
        run: uv run --no-sync pytest

      - name: Re-run E2E with journey artifacts
        if: failure()
        run: uv run --no-sync pytest tests/e2e --no-cov --journey-artifacts e2e-artifacts

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint and format (changed files)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install CPython 3.14
        run: uv python install 3.14

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.14

      # The repository carries pre-existing, repo-wide formatting debt, so a
      # global `ruff check .` / `black --check .` would always fail. Gate only
      # the Python files touched by this push or pull request, which keeps new
      # code clean while the backlog is paid down incrementally.
      - name: Resolve changed Python files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "$head^" 2>/dev/null || echo "$head")"
          fi
          git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.py' > changed.txt || true
          echo "Changed Python files:"
          cat changed.txt
          if [ -s changed.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ruff
        if: steps.changed.outputs.any == 'true'
        run: xargs -r -a changed.txt uv run --no-sync ruff check

      - name: Black
        if: steps.changed.outputs.any == 'true'
        run: xargs -r -a changed.txt uv run --no-sync black --check

      - name: Apache license header
        if: steps.changed.outputs.any == 'true'
        run: xargs -r -a changed.txt uv run --no-sync python scripts/check_license_header.py
