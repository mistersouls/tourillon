[build-system]
requires = ["hatchling>=1"]
build-backend = "hatchling.build"

[project]
name = "tourproject"
version = "0.1.0.dev1"
description = "Leaderless peer-to-peer distributed key-value database."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
    # formatting
    "black>=24",
    # linting / import sorting / upgrades
    "ruff>=0.9",
    # unused-import / variable removal
    "autoflake>=2",
    # git hooks framework
    "pre-commit>=4",
    # standard hook scripts (trailing-whitespace, end-of-file-fixer, check-yaml, check-toml)
    "pre-commit-hooks>=4.6",
    # testing
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=8",
    "pytest-cov>=5",
    # CLI testing
    "click>=8",
    # complexity analysis
    "radon>=6",
]

[dependency-groups]
workspace = ["tourillon", "tourctl"]

[tool.uv.workspace]
members = ["tourillon", "tourctl", "tourlib"]

[tool.uv]
default-groups = ["workspace"]
package = false

[tool.uv.sources]
tourillon = { workspace = true }
tourctl = { workspace = true }
tourlib = { workspace = true }

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py313"]   # closest target supported by black; 3.14 tracks 3.13 grammar

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/W = pycodestyle  F = pyflakes  I = isort  N = pep8-naming
# UP = pyupgrade     B = bugbear   SIM = simplify  C90 = mccabe complexity
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C90"]
ignore = [
    "E501", # line length enforced by black
    "B008", # typer.Option() in argument defaults is the canonical Typer pattern
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["tourillon", "tourctl", "tourlib", "tourclient"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=tourillon --cov=tourctl --cov=tourlib --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
asyncio_mode = "auto"
markers = [
    "tourillon: marks tests as belonging to the tourillon package",
    "tourctl: marks tests as belonging to the tourctl package",
    "tourlib: marks tests as belonging to the tourlib package",
    "e2e: marks end-to-end tests",
]
