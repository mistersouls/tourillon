[build-system]
requires = ["hatchling>=1"]
build-backend = "hatchling.build"

[project]
name = "tourctl"
version = "0.1.0.dev3"
description = "Command-line client and operator tools for Tourillon."
requires-python = ">=3.14"
dependencies = ["tourclient", "tourlib"]

[project.scripts]
tourctl = "tourctl.bootstrap.main:app"

[tool.uv]
package = true

[tool.uv.sources]
tourclient = { workspace = true }
tourlib = { workspace = true }

[tool.hatch.build.targets.wheel]
include = ["**/*.py"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "tourctl"
